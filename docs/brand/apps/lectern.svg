<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="Lectern">
  <title>Lectern</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#26231f"/><stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#b4471f"/><stop offset="1" stop-color="#ef8a5c"/>
    </linearGradient>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)" stroke="#34302a" stroke-width="2"/>
  <!-- microphone -->
  <rect x="36" y="22" width="26" height="44" rx="13" fill="url(#ac)"/>
  <path d="M28 54 v4 a21 21 0 0 0 42 0 v-4" fill="none" stroke="#efe9e1" stroke-width="5" stroke-linecap="round"/>
  <line x1="49" y1="79" x2="49" y2="92" stroke="#efe9e1" stroke-width="5" stroke-linecap="round"/>
  <line x1="37" y1="94" x2="61" y2="94" stroke="#efe9e1" stroke-width="5" stroke-linecap="round"/>
  <!-- lines of text appearing -->
  <g stroke-linecap="round" stroke-width="6">
    <line x1="80" y1="40" x2="102" y2="40" stroke="#efe9e1"/>
    <line x1="80" y1="56" x2="98" y2="56" stroke="#efe9e1"/>
    <line x1="80" y1="72" x2="92" y2="72" stroke="#9a9288" stroke-dasharray="4 6"/>
  </g>
  <!-- the Monad point: the signature shared by every app of the family -->
  <circle cx="101" cy="101" r="7" fill="none" stroke="#efe9e1" stroke-width="2.5" stroke-opacity="0.85"/>
  <circle cx="101" cy="101" r="2.6" fill="#e6b85c"/>
</svg>
